<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta
      name="description"
      content="Terravia — RPG de capture de créatures dans un monde généré procéduralement. Jouable dans le navigateur, sauvegarde exportable en JSON."
    />
    <title>Terravia</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }
      /* Colonne : la scène prend toute la place disponible, les contrôles tactiles
         occupent le bas. Le canvas est ainsi dimensionné d'après l'espace qui lui
         reste réellement, au lieu de se superposer aux boutons. */
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      /* Aucun rembourrage : le canvas se dimensionne sur la place réelle, et quatre
         pixels de marge se voyaient comme un liseré noir sur téléphone. */
      #scene {
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        touch-action: none;
      }

      /* Écran affiché avant que le JS ne prenne la main, et si le JS échoue. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #7d8590;
        font-size: 14px;
        letter-spacing: 0.1em;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      #boot.gone {
        opacity: 0;
      }
      noscript {
        color: #e6edf3;
        text-align: center;
        padding: 2rem;
      }

      /* Contrôles tactiles.
         Ils vivent dans le DOM, pas sur le canvas : ils profitent ainsi de la taille
         réelle de l'écran plutôt que de la résolution virtuelle de 320 pixels, et
         restent assez grands pour le pouce. Ils disparaissent dès qu'un pointeur fin
         est disponible — sur desktop, ils n'apparaissent jamais. */
      .tactile {
        flex: 0 0 auto;
        /* Zone sûre latérale comprise : sur un téléphone à encoche, les boutons se
           collaient au bord arrondi. */
        padding-left: max(1rem, env(safe-area-inset-left));
        padding-right: max(1rem, env(safe-area-inset-right));
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0.5rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
        pointer-events: none;
        user-select: none;
      }
      @media (pointer: fine) {
        .tactile {
          display: none;
        }
      }
      .tactile button {
        pointer-events: auto;
        background: rgba(244, 241, 230, 0.14);
        border: 1px solid rgba(244, 241, 230, 0.28);
        color: #e6edf3;
        font: inherit;
        font-size: 18px;
        border-radius: 12px;
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        backdrop-filter: blur(4px);
        transition: background 0.08s;
      }
      .tactile button.enfonce {
        background: rgba(224, 160, 60, 0.5);
      }
      .tactile-croix {
        display: grid;
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(2, 52px);
        gap: 4px;
      }
      .tactile-croix button[data-action='nord'] {
        grid-area: 1 / 2;
      }
      .tactile-croix button[data-action='ouest'] {
        grid-area: 2 / 1;
      }
      .tactile-croix button[data-action='sud'] {
        grid-area: 2 / 2;
      }
      .tactile-croix button[data-action='est'] {
        grid-area: 2 / 3;
      }
      .tactile-boutons {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .tactile-boutons button[data-action='valider'] {
        width: 62px;
        height: 62px;
        background: rgba(126, 231, 178, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="app"><div id="scene"></div></div>
    <div id="boot">TERRAVIA</div>
    <noscript>
      <div style="position: fixed; inset: 0; display: grid; place-items: center">
        Terravia a besoin de JavaScript pour fonctionner.
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Les vérifications tournaient seulement après le merge, sur l'artefact déjà en route
  # vers la production : une pull request rouge cassait le site avant qu'on la lise.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois. Une nouvelle poussée annule celle en attente,
# mais jamais un déploiement déjà commencé.
concurrency:
  group: pages
  cancel-in-progress: false

# Le droit de publier n'est accordé qu'au job qui publie. Le job de build, lui, ne fait
# que lire le dépôt.
permissions:
  contents: read

jobs:
  build:
    name: Tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # L'art est commité. On le régénère et on exige que rien n'ait bougé : une planche
      # oubliée après un changement de code se voit ici, pas en jeu.
      #
      # `git status --porcelain` plutôt que `git diff` : ce dernier ne voit que les
      # fichiers déjà suivis. Ajouter une planche au générateur passait donc au vert,
      # alors que le fichier n'était commité nulle part.
      - name: L’art commité est-il à jour ?
        run: |
          npm run art
          if [ -n "$(git status --porcelain public/art)" ]; then
            git status --porcelain public/art
            echo "::error::public/art/ n’est plus synchronisé. Lancez « npm run art » et committez le résultat."
            exit 1
          fi

      - name: Build
        run: npm run build

      # Le build peut réussir en ne produisant rien d'utile : si le dossier public ou le
      # chemin de base changeaient, la CI resterait verte et la page afficherait
      # « Planche introuvable ». On vérifie donc l'artefact lui-même.
      - name: L’artefact contient-il de quoi jouer ?
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html manquant"; exit 1; }
          planches=$(ls dist/art 2>/dev/null | wc -l)
          if [ "$planches" -eq 0 ]; then
            echo "::error::dist/art/ est vide : le jeu démarrerait sans ses images."
            exit 1
          fi
          grep -q '/terravia/' dist/index.html || {
            echo "::error::dist/index.html ne référence pas le chemin de base /terravia/."
            exit 1
          }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Déploiement
    # Une pull request se vérifie, elle ne se publie pas.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
